services:
  trading:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading:latest
    container_name: trading-luminia
    restart: unless-stopped
    # Sin "ports": Cloudflare Tunnel entra por la red luminia_default → http://trading-luminia:4300
    # (así no choca con otros puertos del NAS y nadie puede saltarse Cloudflare)
    # Las claves van en .env (no se suben a git). Copia .env.example → .env y complétalo.
    env_file: .env
    environment:
      - NODE_ENV=production
    # Misma red que el túnel de Cloudflare y el resto de proyectos de Luminia
    networks:
      - luminia_default

networks:
  luminia_default:
    external: true
    name: luminia_default
