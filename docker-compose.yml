services:
  trading:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading:latest
    container_name: trading-luminia
    restart: unless-stopped
    ports:
      - "4300:4300"
    # Las claves van en .env (no se suben a git). Copia .env.example → .env y complétalo.
    env_file: .env
    environment:
      - NODE_ENV=production
    # Misma red que el túnel de Cloudflare y el resto de proyectos de Luminia
    networks:
      - luminia_default

networks:
  luminia_default:
    external: true
    name: luminia_default
